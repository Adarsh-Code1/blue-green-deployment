
name: Blue-Green Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker access
        run: docker ps

      - name: Check deployment script syntax
        run: bash -n deploy.sh

      - name: Build Docker image
        run: docker build -f dockerfile -t blue-green-demo:v2 .

      - name: Deploy application
        run: bash deploy.sh blue-green-demo:v2

